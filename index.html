  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      padding-top: 80px; /* Space for the fixed header */
    }
    .font-fredoka {
      font-family: 'Fredoka', sans-serif;
    }
    /* Ruby Alignment and Styling */
    ruby {
      ruby-position: over;
      ruby-align: center;
      word-break: keep-all;
    }
    rt {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.58em;
      color: #2563eb; /* Biru Lebih Pekat untuk Furigana */
      padding-bottom: 0.12em;
      letter-spacing: 0.05em;
      user-select: none;
    }
    .dark rt {
      color: #60a5fa; /* Biru terang kontras tinggi di mode gelap */
    }
    /* Prevent text cut-off on mobile */
    .ruby-container {
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 3D Flashcard flip styles */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>

      }
    }
  </script>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Daftar Akun Terdaftar
    const REGISTERED_USERS = [
      { id: "peserta_ssw", email: "peserta@ssw.com", password: "password123", name: "Peserta SSW Hub" },
      { id: "sukses_gh", email: "groundhandling@ssw.com", password: "belajarsampailolos", name: "Sukses GH Jepang" }
    ];

    // SVG Icon Component
    function Icon({ name, className = "w-5 h-5" }) {

        "triangle-alert": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

            <line x1="12" y1="9" x2="12" y2="13"/>

        ),
        "help-circle": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        ),
        "check-circle": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        "x-circle": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/>

        ),
        "chevron-left": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </g>
        ),
        "chevron-right": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </g>
        ),
        "lock": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </g>
        ),
        "log-out": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </g>
        ),
        "eye": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </g>
        ),
        "eye-off": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61M2 2l20 20"/>
          </g>
        ),
        "shuffle": (
          <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      return (
        <svg
          className={className}
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
        >
          {paths[name] || null}
        </svg>
      );
    }

    function App() {
      // Default Dark Mode
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('theme');
        return saved ? saved === 'dark' : true;
      });

      // User State
      const [user, setUser] = useState(() => {
        const savedUser = localStorage.getItem('ssw_active_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });

      // Mastered Vocabulary Tracker
      const [masteredVocab, setMasteredVocab] = useState(() => {
        const saved = localStorage.getItem('ssw_mastered_vocab');
        return saved ? JSON.parse(saved) : {};
      });

      // State Form Login
      const [emailInput, setEmailInput] = useState("");
      const [passwordInput, setPasswordInput] = useState("");
      const [loginError, setLoginError] = useState("");
      const [isAuthenticating, setIsAuthenticating] = useState(false);

      const [activeModule, setActiveModule] = useState(1);
      
      // State data halaman dari FIRESTORE
      const [pages, setPages] = useState([]);
      const [isLoadingData, setIsLoadingData] = useState(true);

      const [currentPageIdx, setCurrentPageIdx] = useState(0);
      const activePage = pages[currentPageIdx] || null;

      const [openedTranslations, setOpenedTranslations] = useState({});
      const [isPlayingFullPage, setIsPlayingFullPage] = useState(false);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [showResetModal, setShowResetModal] = useState(false);

      // Flashcard State
      const [isFlashcardOpen, setIsFlashcardOpen] = useState(false);
      const [flashcardsList, setFlashcardsList] = useState([]);
      const [currentFlashcardIdx, setCurrentFlashcardIdx] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [hideFurigana, setHideFurigana] = useState(false);
      const [isShuffled, setIsShuffled] = useState(false);

      // Effect: Mengambil data dari Firestore saat aplikasi dibuka
      useEffect(() => {
        async function fetchPagesFromFirestore() {
          try {
            const { collection, getDocs, query, orderBy } = window.firestoreUtils;
            const q = query(collection(window.db, "ssw_pages"), orderBy("pageNumber", "asc"));
            const querySnapshot = await getDocs(q);
            
            const loadedPages = [];
            querySnapshot.forEach((doc) => {
              loadedPages.push(doc.data());
            });

            setPages(loadedPages);
          } catch (error) {
            console.error("Gagal mengambil data dari Firestore:", error);
          } finally {
            setIsLoadingData(false);
          }
        }

        fetchPagesFromFirestore();
      }, []);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }, [darkMode]);

      useEffect(() => {
        setOpenedTranslations({});
        stopAudio();
        setIsFlashcardOpen(false);
      }, [currentPageIdx]);

      useEffect(() => {
        setCurrentPageIdx(0);
        stopAudio();
        setIsFlashcardOpen(false);
      }, [activeModule]);

      const progressPercent = useMemo(() => {
        if (activeModule === 2) return 0;
        if (pages.length === 0) return 0;
        return Math.round(((currentPageIdx + 1) / pages.length) * 100);
      }, [currentPageIdx, pages, activeModule]);

      const toggleTranslation = (idx) => {
        setOpenedTranslations(prev => ({
          ...prev,
          [idx]: !prev[idx]
        }));
      };

      const handleQuizAnswer = (quizIdx, choice) => {
        const quiz = activePage.quizzes[quizIdx];
        const isCorrect = quiz.options ? quiz.options[choice].isCorrect : quiz.isCorrect === choice;

        setQuizAnswers(prev => ({
          ...prev,
          [currentPageIdx]: {
            ...(prev[currentPageIdx] || {}),
            [quizIdx]: { chosen: choice, isCorrect }
          }
        }));
      };

      const cleanJapaneseText = (htmlString) => {
        const temp = document.createElement("div");
        temp.innerHTML = htmlString;
        const rts = temp.getElementsByTagName("rt");
        while (rts.length > 0) {
          rts[0].parentNode.removeChild(rts[0]);
        }
        let text = temp.textContent || temp.innerText || "";
        text = text.replace(/^[①②③➃⑤⑥⑦⑧⑨⑩A-Z]\.?\s*/i, "");
        text = text.replace(/^\d+\.?\s*/, "");
        text = text.replace(/^\([0-9]+\)\s*/, "");
        return text;
      };

      const stopAudio = () => {
        window.speechSynthesis.cancel();
        setIsPlayingFullPage(false);
      };

      const playSentenceAudio = (jpText, idText, e) => {
        if (e) e.stopPropagation();
        stopAudio();

        const jpClean = cleanJapaneseText(jpText);
        const jpUtterance = new SpeechSynthesisUtterance(jpClean);
        jpUtterance.lang = "ja-JP";
        jpUtterance.rate = 0.85;

        const voices = window.speechSynthesis.getVoices();
        const jaVoice = voices.find(v => v.lang.startsWith("ja"));
        if (jaVoice) jpUtterance.voice = jaVoice;

        const idCleanDiv = document.createElement("div");
        idCleanDiv.innerHTML = idText;
        const idClean = idCleanDiv.textContent || idCleanDiv.innerText || "";

        const idUtterance = new SpeechSynthesisUtterance(idClean);
        idUtterance.lang = "id-ID";
        idUtterance.rate = 0.95;

        const idVoice = voices.find(v => v.lang.startsWith("id"));
        if (idVoice) idUtterance.voice = idVoice;

        window.speechSynthesis.speak(jpUtterance);
        window.speechSynthesis.speak(idUtterance);
      };

      const playFullPageAudio = () => {
        stopAudio();
        setIsPlayingFullPage(true);

        if (!activePage || !activePage.content || activePage.content.length === 0) return;
        const contentArray = activePage.content;

        let index = 0;

        const playNext = () => {
          if (index >= contentArray.length) {
            setIsPlayingFullPage(false);
            return;
          }

          const item = contentArray[index];
          const jpClean = cleanJapaneseText(item.jp);
          const jpUtterance = new SpeechSynthesisUtterance(jpClean);
          jpUtterance.lang = "ja-JP";
          jpUtterance.rate = 0.85;
          const voices = window.speechSynthesis.getVoices();
          const jaVoice = voices.find(v => v.lang.startsWith("ja"));
          if (jaVoice) jpUtterance.voice = jaVoice;

          const idCleanDiv = document.createElement("div");
          idCleanDiv.innerHTML = item.id;
          const idClean = idCleanDiv.textContent || idCleanDiv.innerText || "";

          const idUtterance = new SpeechSynthesisUtterance(idClean);
          idUtterance.lang = "id-ID";
          idUtterance.rate = 0.95;
          const idVoice = voices.find(v => v.lang.startsWith("id"));
          if (idVoice) idUtterance.voice = idVoice;

          idUtterance.onend = () => {
            index++;
            playNext();
          };

          jpUtterance.onerror = () => setIsPlayingFullPage(false);
          idUtterance.onerror = () => setIsPlayingFullPage(false);

          window.speechSynthesis.speak(jpUtterance);
          window.speechSynthesis.speak(idUtterance);
        };

        playNext();
      };

      const executeReset = () => {
        setQuizAnswers({});
        setMasteredVocab({});
        localStorage.removeItem('ssw_mastered_vocab');
        setCurrentPageIdx(0);
        setActiveModule(1);
        stopAudio();
        setShowResetModal(false);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError("");
        setIsAuthenticating(true);

        const foundUser = REGISTERED_USERS.find(
          (u) => u.email.toLowerCase() === emailInput.trim().toLowerCase() && u.password === passwordInput
        );

        if (foundUser) {
          setUser(foundUser);
          localStorage.setItem('ssw_active_user', JSON.stringify(foundUser));
          setEmailInput("");
          setPasswordInput("");
        } else {
          setLoginError("Email atau Kata Sandi salah.");
        }
        setIsAuthenticating(false);
      };

      const handleLogout = () => {
        stopAudio();
        setUser(null);
        localStorage.removeItem('ssw_active_user');
      };

      const handleFillCredentials = (email, password) => {
        setEmailInput(email);
        setPasswordInput(password);
        setLoginError("");
      };

      const startFlashcards = () => {
        if (!activePage || !activePage.vocab || activePage.vocab.length === 0) return;
        setFlashcardsList([...activePage.vocab]);
        setCurrentFlashcardIdx(0);
        setIsFlipped(false);
        setIsShuffled(false);
        setIsFlashcardOpen(true);
      };

      const toggleShuffleFlashcards = () => {
        if (isShuffled) {
          setFlashcardsList([...activePage.vocab]);
          setIsShuffled(false);
        } else {
          const shuffled = [...flashcardsList].sort(() => Math.random() - 0.5);
          setFlashcardsList(shuffled);
          setIsShuffled(true);
        }
        setCurrentFlashcardIdx(0);
        setIsFlipped(false);
      };

      const toggleMasteredVocab = (kanji) => {
        const updated = {
          ...masteredVocab,
          [kanji]: !masteredVocab[kanji]
        };
        setMasteredVocab(updated);
        localStorage.setItem('ssw_mastered_vocab', JSON.stringify(updated));
      };

      const activeFlashcard = flashcardsList[currentFlashcardIdx];

      // Indikator Loading Data Firestore
      if (isLoadingData) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center space-y-4 font-fredoka">
            <div className="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
            <p className="text-sm tracking-wide text-slate-300">Memuat Materi dari Cloud Firestore...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col transition-colors duration-300 w-full overflow-x-hidden">
          
          {/* HEADER BAR */}
          <header className="fixed top-0 left-0 right-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 transition-all w-full h-[64px]">
            <div className="max-w-4xl mx-auto px-2 xs:px-4 h-full flex items-center justify-between">
              
              <div className="flex items-center space-x-1.5 xs:space-x-2.5 min-w-0">
                <div className="w-8 h-8 xs:w-10 xs:h-10 rounded-xl bg-gradient-to-tr from-brand-500 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20 shrink-0">
                  <Icon name="book-open" className="w-4.5 h-4.5 xs:w-6 xs:h-6" />
                </div>
                <div className="min-w-0">
                  <h1 className="text-[10px] xs:text-xs sm:text-base md:text-lg font-bold font-fredoka tracking-wide text-brand-600 dark:text-brand-500 flex items-center gap-1">
                    <span className="truncate">
                      <span className="inline xs:hidden">SSW Ground Handling</span>
                      <span className="hidden xs:inline">🇮🇩 SSW GROUND HANDLING 🇯🇵</span>
                    </span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center space-x-1 xs:space-x-2 shrink-0">
                {user && activeModule === 1 && (
                  <select
                    value={currentPageIdx}
                    onChange={(e) => setCurrentPageIdx(Number(e.target.value))}
                    className="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 font-bold font-fredoka px-1.5 py-1 xs:px-2.5 xs:py-1.5 sm:px-3 sm:py-2 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 text-[10px] sm:text-xs md:text-sm cursor-pointer w-[80px] xs:w-[110px] sm:w-[180px] md:w-[220px] truncate"
                  >
                    {pages.map((p, idx) => (
                      <option key={idx} value={idx}>
                        Hal {p.pageNumber}: {p.title}
                      </option>
                    ))}
                  </select>
                )}

                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-1.5 xs:p-2 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors"
                  title="Ganti Tema"
                >
                  <Icon name={darkMode ? "sun" : "moon"} className="w-3.5 h-3.5 xs:w-4 xs:h-4 sm:w-5 sm:h-5" />
                </button>

                {user && (
                  <React.Fragment>

                      {activePage.quizzes && (
                        <div className="mt-8 sm:mt-12 p-3.5 sm:p-6 bg-slate-50 dark:bg-slate-900/30 border-t border-slate-100 dark:border-slate-800 rounded-xl">
                          <div className="flex items-center space-x-2 mb-4 sm:mb-6">
                            <Icon name="help-circle" className="text-brand-500 w-4 h-4 sm:w-5 sm:h-5 animate-pulse" />
                            <h3 className="text-sm sm:text-lg font-bold">Kuis Pemahaman Mandiri (〇✕ クイズ)</h3>
                          </div>

                          <div className="space-y-4 sm:space-y-6">
                            {activePage.quizzes.map((quiz, qIdx) => {
                              const state = quizAnswers[currentPageIdx]?.[qIdx];
                              const hasAnswered = !!state;

                              const getButtonClass = (isCorrectBtn) => {
                                if (!hasAnswered) {
                                  if (isCorrectBtn) {
                                    return "bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/20 dark:hover:bg-emerald-900/40 border-2 border-emerald-500 dark:border-emerald-400 text-emerald-900 dark:text-emerald-200 font-bold shadow-sm transition-all";
                                  } else {
                                    return "bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/20 dark:hover:bg-rose-900/40 border-2 border-rose-500 dark:border-rose-400 text-rose-900 dark:text-rose-200 font-bold shadow-sm transition-all";
                                  }
                                }

                                const userChoseThis = state.chosen === isCorrectBtn;
                                const isCorrectAnswer = quiz.isCorrect === isCorrectBtn;

                                if (userChoseThis) {
                                  return state.isCorrect 
                                    ? "bg-emerald-600 dark:bg-emerald-500 text-white border-2 border-emerald-700 shadow-md font-bold scale-[1.01] transition-all"
                                    : "bg-rose-600 dark:bg-rose-500 text-white border-2 border-rose-700 shadow-md font-bold scale-[1.01] transition-all";
                                } else {
                                  return isCorrectAnswer 
                                    ? "bg-emerald-100/40 dark:bg-emerald-950/10 text-emerald-800 dark:text-emerald-400 border-2 border-dashed border-emerald-500"
                                    : "opacity-30 bg-slate-100 dark:bg-slate-900 text-slate-400 cursor-not-allowed";
                                }
                              };

                              return (
                                <div key={qIdx} className="bg-white dark:bg-slate-800/80 p-4 sm:p-5 rounded-xl border border-slate-200/60 dark:border-slate-700/60 shadow-sm space-y-3 sm:space-y-4 animate-fadeIn">
                                  <div className="text-slate-400 dark:text-slate-550 text-[10px] font-bold uppercase tracking-wider flex items-center justify-between">
                                    <span>Pertanyaan {qIdx + 1}</span>
                                    {hasAnswered && (
                                      <span className={`flex items-center gap-1.5 text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                        state.isCorrect ? "text-emerald-700 bg-emerald-100 dark:text-emerald-400 dark:bg-emerald-950" : "text-rose-700 bg-rose-100 dark:text-rose-400 dark:bg-rose-950"
                                      }`}>
                                        <Icon name={state.isCorrect ? "check-circle" : "x-circle"} className="w-3.5 h-3.5" />
                                        {state.isCorrect ? "Betul" : "Salah"}
                                      </span>
                                    )}
                                  </div>

                                  <div className="font-semibold text-sm sm:text-base text-slate-950 dark:text-slate-100 leading-relaxed text-center"
                                       dangerouslySetInnerHTML={{ __html: quiz.question }}
                                  />

                                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-4 pt-1">
                                    <button
                                      onClick={() => handleQuizAnswer(qIdx, true)}
                                      disabled={hasAnswered}
                                      className={`py-2.5 sm:py-3 px-4 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-2 ${getButtonClass(true)}`}
                                    >
                                      <span className="text-sm">〇</span>
                                      <span>Betul (Tadashii)</span>
                                    </button>

                                    <button
                                      onClick={() => handleQuizAnswer(qIdx, false)}
                                      disabled={hasAnswered}
                                      className={`py-2.5 sm:py-3 px-4 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-2 ${getButtonClass(false)}`}
                                    >
                                      <span className="text-sm">✕</span>
                                      <span>Salah (Machigatte)</span>
                                    </button>
                                  </div>

                                  {hasAnswered && (
                                    <div className="mt-2 p-3 bg-slate-50 dark:bg-slate-900/60 rounded-lg text-xs md:text-sm leading-relaxed text-slate-500 dark:text-slate-400 border border-dashed border-slate-200 dark:border-slate-700 animate-fadeIn break-words">
                                      <span className="font-bold text-brand-600 dark:text-brand-400 block mb-0.5">Penjelasan:</span>
                                      {quiz.explanation}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="p-3 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-800 text-center">
                      <span className="text-xs font-bold text-slate-400 dark:text-slate-500 font-fredoka">
                        Halaman {currentPageIdx + 1} dari {pages.length}
                      </span>
                    </div>
                  </div>
                ) : (
                  /* MODUL 2 SOON */
                  <div className="bg-white dark:bg-slate-900 rounded-xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-8 text-center flex flex-col items-center justify-center min-h-[450px] animate-fadeIn">
                    <div className="w-16 h-16 rounded-2xl bg-brand-50 dark:bg-brand-950/50 flex items-center justify-center text-brand-500 mb-6 animate-bounce">
                      <Icon name="book-open" className="w-8 h-8" />
                    </div>
                    <h3 className="text-xl sm:text-2xl font-bold font-fredoka text-slate-900 dark:text-white mb-2">
                      MODUL 2: Operasional Apron & Marshalling Lanjutan
                    </h3>
                    <span className="bg-purple-100 dark:bg-purple-900/50 text-purple-700 dark:text-purple-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4 font-fredoka">
                      Segera Hadir / Coming Soon
                    </span>
                    <p className="text-sm text-slate-500 dark:text-slate-400 max-w-md leading-relaxed mb-6">
                      Modul 2 sedang dalam proses penyusunan konten interaktif.
                    </p>
                    <button
                      onClick={() => setActiveModule(1)}
                      className="px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl shadow-md transition-all text-xs sm:text-sm font-fredoka"
                    >
                      Kembali ke Modul 1
                    </button>
                  </div>
                )}
              </React.Fragment>
            )}
          </main>

          {/* FLASHCARD MODAL */}
          {user && isFlashcardOpen && activeFlashcard && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                
                <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between bg-slate-50 dark:bg-slate-900/50">
                  <div className="flex items-center space-x-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
                    <h4 className="font-bold font-fredoka text-xs sm:text-sm text-slate-700 dark:text-slate-300">
                      Flashcard Kosakata - Hal {activePage.pageNumber}
                    </h4>
                  </div>
                  <button
                    onClick={() => setIsFlashcardOpen(false)}
                    className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-rose-100 dark:hover:bg-rose-950/40 text-slate-500 hover:text-rose-500 transition-colors"
                  >
                    <Icon name="x-circle" className="w-4.5 h-4.5" />
                  </button>
                </div>

                <div className="p-6 flex-1 flex flex-col items-center justify-center space-y-6 overflow-y-auto">
                  <div className="w-full flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 font-bold font-fredoka px-2">
                    <span>{isShuffled ? "Urutan Diacak 🔀" : "Urutan Normal 📋"}</span>
                    <span>KARTU {currentFlashcardIdx + 1} / {flashcardsList.length}</span>
                  </div>

                  <div 
                    className="w-full h-64 perspective-1000 cursor-pointer"
                    onClick={() => setIsFlipped(!isFlipped)}
                  >
                    <div className={`relative w-full h-full duration-500 transform-style-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                      <div className="absolute inset-0 w-full h-full backface-hidden bg-slate-50 dark:bg-slate-950 rounded-2xl border-2 border-purple-300 dark:border-purple-900 shadow-lg flex flex-col items-center justify-between p-6">
                        <div className="w-full flex justify-between items-center text-xs text-slate-400">
                          <span className="font-semibold uppercase tracking-widest text-[9px] bg-slate-200/50 dark:bg-slate-800 px-2 py-0.5 rounded-md">DEPAN (KANJI)</span>
                          {masteredVocab[activeFlashcard.kanji] && (
                            <span className="text-brand-600 dark:text-brand-400 font-fredoka text-[10px] flex items-center gap-1">⭐ Mastered</span>
                          )}
                        </div>
                        
                        <div className="text-center my-auto">
                          {hideFurigana ? (
                            <div className="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-white tracking-wide">
                              {activeFlashcard.kanji}
                            </div>
                          ) : (
                            <ruby className="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-white tracking-wide">
                              {activeFlashcard.kanji}<rt className="text-sm sm:text-base md:text-lg mb-1">{activeFlashcard.furigana}</rt>
                            </ruby>
                          )}
                        </div>

                        <div className="text-xs text-slate-400 dark:text-slate-500 italic flex items-center gap-1">
                          <Icon name="info" className="w-3.5 h-3.5" />
                          <span>Ketuk untuk membalik kartu</span>
                        </div>
                      </div>

                      <div className="absolute inset-0 w-full h-full backface-hidden bg-gradient-to-br from-purple-500/10 to-indigo-500/10 dark:from-purple-950/30 dark:to-indigo-950/30 rounded-2xl border-2 border-purple-500 dark:border-purple-600 shadow-lg flex flex-col items-center justify-between p-6 rotate-y-180">
                        <div className="w-full flex justify-between items-center text-xs">
                          <span className="font-semibold uppercase tracking-widest text-[9px] bg-purple-200/50 dark:bg-purple-900/50 text-purple-700 dark:text-purple-400 px-2 py-0.5 rounded-md">BELAKANG (ARTI)</span>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              playSentenceAudio(`<ruby>${activeFlashcard.kanji}<rt>${activeFlashcard.furigana}</rt></ruby>`, activeFlashcard.arti);
                            }}
                            className="p-1.5 rounded-lg bg-white dark:bg-slate-800 text-purple-600 dark:text-purple-400 hover:bg-purple-50 transition-colors shadow"
                            title="Putar Audio"
                          >
                            <Icon name="volume-2" className="w-4 h-4" />
                          </button>
                        </div>

                        <div className="text-center my-auto px-4">
                          <div className="text-2xl sm:text-3xl font-extrabold text-purple-900 dark:text-purple-300 tracking-wide leading-snug">
                            {activeFlashcard.arti}
                          </div>
                          <div className="text-sm font-semibold text-slate-500 dark:text-slate-400 mt-2 font-mono">
                            {activeFlashcard.kanji} 【{activeFlashcard.furigana}】
                          </div>
                        </div>

                        <div className="text-xs text-purple-500 dark:text-purple-400 italic flex items-center gap-1">
                          <Icon name="info" className="w-3.5 h-3.5" />
                          <span>Ketuk untuk kembali ke depan</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2 w-full pt-2">
                    <button
                      onClick={toggleShuffleFlashcards}
                      className={`py-2 px-3 rounded-xl border font-semibold text-[11px] sm:text-xs flex items-center justify-center gap-1.5 transition-colors ${
                        isShuffled 
                          ? 'bg-purple-100 dark:bg-purple-950 border-purple-300 dark:border-purple-800 text-purple-700 dark:text-purple-400' 
                          : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      <Icon name="shuffle" className="w-4 h-4" />
                      <span>{isShuffled ? "Urut" : "Acak"}</span>
                    </button>

                    <button
                      onClick={() => setHideFurigana(!hideFurigana)}
                      className={`py-2 px-3 rounded-xl border font-semibold text-[11px] sm:text-xs flex items-center justify-center gap-1.5 transition-colors ${
                        hideFurigana 
                          ? 'bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-900 text-amber-700 dark:text-amber-400' 
                          : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      <Icon name={hideFurigana ? "eye-off" : "eye"} className="w-4 h-4" />
                      <span>{hideFurigana ? "Furigana" : "Sembunyi"}</span>
                    </button>

                    <button
                      onClick={() => toggleMasteredVocab(activeFlashcard.kanji)}
                      className={`py-2 px-3 rounded-xl border font-semibold text-[11px] sm:text-xs flex items-center justify-center gap-1.5 transition-colors ${
                        masteredVocab[activeFlashcard.kanji]
                          ? 'bg-brand-100 dark:bg-brand-950 border-brand-300 dark:border-brand-800 text-brand-700 dark:text-brand-400'
                          : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      <span>★</span>
                      <span>{masteredVocab[activeFlashcard.kanji] ? "Hafal" : "Kuasai"}</span>
                    </button>
                  </div>

                </div>

                <div className="px-6 py-4 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between bg-slate-50 dark:bg-slate-900/50">
                  <button
                    onClick={() => {
                      setCurrentFlashcardIdx(prev => Math.max(0, prev - 1));
                      setIsFlipped(false);
                    }}
                    disabled={currentFlashcardIdx === 0}
                    className="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-750 text-slate-700 dark:text-slate-300 rounded-xl font-fredoka font-bold text-xs hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none transition-all flex items-center gap-1"
                  >
                    <Icon name="chevron-left" className="w-4 h-4" />
                    <span>Sebelumnya</span>
                  </button>

                  <button
                    onClick={() => {
                      if (currentFlashcardIdx === flashcardsList.length - 1) {
                        setIsFlashcardOpen(false);
                      } else {
                        setCurrentFlashcardIdx(prev => prev + 1);
                        setIsFlipped(false);
                      }
                    }}
                    className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-fredoka font-bold text-xs shadow-md transition-all flex items-center gap-1"
                  >
                    <span>{currentFlashcardIdx === flashcardsList.length - 1 ? "Selesai ✨" : "Berikutnya"}</span>
                    <Icon name="chevron-right" className="w-4 h-4" />
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* RESET DIALOG */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 w-full max-w-sm shadow-2xl flex flex-col space-y-4">
                <div className="text-center">
                  <div className="w-12 h-12 rounded-full bg-rose-50 dark:bg-rose-950 text-rose-500 flex items-center justify-center mx-auto mb-3">
                    <Icon name="rotate-ccw" className="w-6 h-6 text-rose-600 dark:text-rose-400" />
                  </div>
                  <h4 className="text-base sm:text-lg font-bold font-fredoka text-slate-950 dark:text-white">Atur Ulang Progres?</h4>
                  <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
                    Tindakan ini akan menghapus seluruh status pengerjaan kuis Anda, daftar hafalan glosarium, dan kembali ke Halaman 1.
                  </p>
                </div>
                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="py-2.5 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs sm:text-sm transition-colors font-fredoka"
                  >
                    Batal
                  </button>
                  <button
                    onClick={executeReset}
                    className="py-2.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs sm:text-sm transition-colors font-fredoka shadow-md shadow-rose-600/20"
                  >
                    Atur Ulang
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white dark:bg-slate-900 border-t border-slate-150 dark:border-slate-800 py-6 text-center text-[10px] sm:text-xs text-slate-400 dark:text-slate-500 mt-auto w-full">
            <div className="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <p>&copy; 2026 Aplikasi Belajar Mandiri Ujian Evaluasi Kompetensi SSW Ground Handling.</p>
              <div className="flex space-x-4">
                <a href="#" className="hover:text-brand-500 transition-colors">Syarat & Ketentuan</a>
                <a href="#" className="hover:text-brand-500 transition-colors">Kontak</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
