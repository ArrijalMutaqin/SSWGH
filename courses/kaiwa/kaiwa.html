        function parseCSV(csvText) {
            const lines = csvText.split(/\r\n|\n/);
            if (lines.length === 0) return [];

            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const values = [];
                let insideQuote = false;
                let currentVal = '';

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"' || char === "'") {
                        insideQuote = !insideQuote;
                    } else if (char === ',' && !insideQuote) {
                        values.push(currentVal.trim().replace(/^"|"$/g, ''));
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                values.push(currentVal.trim().replace(/^"|"$/g, ''));

                if (values.length >= 2) {
                    const grammar = values[0] || '';
                    const meaning = values[1] || '';
                    const example = values[2] || '';
                    const level = values[3] || 'JLPT N3';
                    const pattern = values[4] || '';

                    result.push({
                        id: 'csv_' + Date.now() + '_' + i,
                        grammar,
                        meaning,
                        example,
                        level,
                        pattern
                    });
                }
            }
            return result;
        }

        function pcmToWav(pcmData, sampleRate = 24000, numChannels = 1) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcmData.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, pcmData.length * 2, true);

            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) {
                view.setInt16(offset, pcmData[i], true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

                }

                let lastError = null;

                for (let i = 0; i < CANDIDATE_MODELS.length; i++) {
                    const modelName = CANDIDATE_MODELS[i];
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`;

                    try {
                        const fullBody = { ...payload };
                        if (systemInstruction) {
                            fullBody.systemInstruction = systemInstruction;
                        }

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(fullBody)
                        });

                        if (response.status === 429) {
                            console.warn(`Model ${modelName} rate limited (429). Beralih ke model cadangan...`);
                            lastError = new Error(`Model ${modelName} telah mencapai batas kuota (429).`);
                            continue;
                        }

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(errData.error?.message || `HTTP ${response.status}`);
                        }

                        const data = await response.json();
                        setIsLimitReached(false);
                        return { data, usedModel: modelName };
                    } catch (err) {
                        console.warn(`Error on model ${modelName}:`, err.message);
                        lastError = err;

                try {
                    const payload = {
                        contents: [{ parts: [{ text: `Say naturally in Japanese: ${text}` }] }],
                        generationConfig: {

                            speechConfig: {

                        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                        const pcmBuffer = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmBuffer);
                        const wavBlob = pcmToWav(pcm16, sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);

                        const audio = new Audio(audioUrl);
                        audio.onended = () => setAudioPlayingIndex(null);

                        </div>

                        {!hasEvaluatedCurrent ? (
                            <div className="space-y-4">
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-slate-700 block">
                                        Terjemahan Anda:
                                    </label>
                                    <textarea
                                        rows={3}
                                        value={inputMessage}
                                        onChange={(e) => setInputMessage(e.target.value)}
                                        placeholder={isJaToId ? 'Ketik terjemahan bahasa Indonesia di sini...' : 'Ketik terjemahan bahasa Jepang di sini...'}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm text-slate-800 focus:outline-none focus:border-indigo-500 resize-none japanese-text"
                                    />
                                </div>

                                <div className="flex items-center justify-between gap-3">
                                    {speechSupported && (
                                        <button
                                            type="button"
                                            onClick={() => toggleListening(isJaToId ? 'id-ID' : 'ja-JP')}
                                            className={`px-4 py-2.5 rounded-xl border text-xs font-bold flex items-center gap-2 ${
                                                isListening ? 'bg-rose-600 text-white border-rose-500 animate-pulse' : 'bg-slate-100 text-slate-700 border-slate-200'
                                            }`}
                                        >
                                            <i className="fa-solid fa-microphone"></i>
                                            <span>{isListening ? 'Mendengarkan...' : 'Ucapkan Suara'}</span>
                                        </button>
                                    )}

                                    <button
                                        type="button"
                                        onClick={() => onEvaluateSubmit(inputMessage)}
                                        disabled={!inputMessage.trim() || isLoading}
                                        className="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs rounded-xl shadow-md transition-all flex items-center gap-2 disabled:opacity-40"
                                    >
                                        {isLoading ? (
                                            <>
                                                <i className="fa-solid fa-spinner animate-spin"></i>
                                                <span>Menilai Akurasi Terjemahan...</span>
                                            </>
                                        ) : (
                                            <>
                                                <i className="fa-solid fa-check"></i>
                                                <span>Submit & Cek Akurasi</span>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-5 animate-fade-in">
                                <div className="p-5 bg-indigo-50 border border-indigo-200 rounded-3xl space-y-3">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-bold text-indigo-900 uppercase">Hasil Penilaian Terjemahan</span>
                                        <span className="px-3 py-1 bg-indigo-600 text-white rounded-full font-black text-xs">
                                            {currentEval.evalResult.accuracy_score}% Akurasi — {currentEval.evalResult.rating_label}
                                        </span>
                                    </div>

                                    <div className="space-y-1">
                                        <span className="text-[10px] text-slate-400 block font-bold">Terjemahan Pengguna:</span>
                                        <p className="text-sm font-semibold text-slate-800 japanese-text">{currentEval.userAnswer}</p>
                                    </div>

                                    <div className="p-3 bg-white rounded-2xl border border-indigo-100 space-y-1">
                                        <span className="text-[10px] text-emerald-600 font-bold block">Variasi Terjemahan Ideal:</span>
                                        <ul className="list-disc list-inside text-xs font-bold text-slate-800 japanese-text space-y-1">
                                            {currentEval.evalResult.ideal_translations?.map((t, idx) => (
                                                <li key={idx}>{t}</li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="text-xs text-slate-700 leading-relaxed bg-white/80 p-3 rounded-2xl border border-indigo-100">
                                        💡 {currentEval.evalResult.explanation_feedback}
                                    </div>
                                </div>

                                <div className="flex justify-end">
                                    <button
                                        type="button"
                                        onClick={onNextQuestion}
                                        className="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs rounded-2xl shadow-md transition-all flex items-center gap-2"
                                    >
                                        <span>
                                            {translateSession.currentIndex + 1 < translateSession.questions.length ? 'Lanjut Soal Berikutnya ➔' : 'Lihat Ringkasan Akhir ➔'}
                                        </span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ChatScreen({
            sessionConfig,
            chatMessages,
            inputMessage,
            setInputMessage,
            onSendMessage,
            isLoading,
            isListening,
            toggleListening,
            speechSupported,
            audioPlayingIndex,
            playJapaneseTTS,
            globalFurigana,
            setGlobalFurigana,
            globalTranslation,
            setGlobalTranslation,
            expandedDetails,
            setExpandedDetails,
            hints,
            setHints,
            onGetHints,
            isLoadingHints,
            targetBunpouList
        }) {
            const chatEndRef = useRef(null);
            const [showBunpouOverlay, setShowBunpouOverlay] = useState(false);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [chatMessages, isLoading]);

            const toggleDetail = (id, section) => {
                setExpandedDetails(prev => ({
                    ...prev,
                    [id]: { ...prev[id], [section]: !prev[id]?.[section] }
                }));
            };

            return (
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-[78vh]">
                    <div className="bg-slate-900 text-white px-5 py-3 flex items-center justify-between flex-wrap gap-2 font-sans">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center font-bold text-xs">
                                {sessionConfig.role.charAt(0)}
                            </div>
                            <div>
                                <h3 className="font-bold text-sm text-white">{sessionConfig.role}</h3>
                                <p className="text-[10px] text-slate-400">📍 {sessionConfig.location} • Level {sessionConfig.level}</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            {targetBunpouList.length > 0 && (
                                <button
                                    onClick={() => setShowBunpouOverlay(!showBunpouOverlay)}
                                    className="px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5"
                                >
                                    <i className="fa-solid fa-book"></i>
                                    <span>Target Bunpou ({targetBunpouList.length})</span>
                                </button>
                            )}

                            <button
                                onClick={() => setGlobalFurigana(!globalFurigana)}
                                className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition-all ${
                                    globalFurigana ? 'bg-rose-600 text-white border-rose-500' : 'bg-slate-800 text-slate-400 border-slate-700'
                                }`}
                            >
                                ふりがな
                            </button>
                        </div>
                    </div>

                    {showBunpouOverlay && (
                        <div className="bg-amber-50 border-b border-amber-200 p-4 space-y-2 text-xs font-sans animate-fade-in">
                            <div className="flex justify-between items-center text-amber-900 font-bold border-b border-amber-200/60 pb-1.5">
                                <span>Target Bunpou Dalam Sesi Ini:</span>
                                <button onClick={() => setShowBunpouOverlay(false)} className="text-amber-700 hover:text-amber-900">
                                    <i className="fa-solid fa-xmark text-sm"></i>
                                </button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                {targetBunpouList.map(b => (
                                    <div key={b.id} className="bg-white p-2.5 rounded-xl border border-amber-200/80 space-y-1">
                                        <div className="font-bold text-slate-800 japanese-text text-xs">{b.grammar}</div>
                                        <div className="text-[11px] text-slate-600">{b.meaning}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 custom-scrollbar bg-slate-50/50">
                        {chatMessages.map((msg, idx) => (
                            <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] sm:max-w-[70%] p-4 rounded-2xl ${
                                    msg.sender === 'user' ? 'bg-rose-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 rounded-tl-none shadow-sm'
                                }`}>
                                    {msg.sender === 'user' ? (
                                        <p className="text-sm japanese-text">{msg.content}</p>
                                    ) : (
                                        <div className="space-y-2">
                                            <div className="text-base font-medium text-slate-800 japanese-text">
                                                {globalFurigana && msg.data?.furigana_html ? (
                                                    <div dangerouslySetInnerHTML={{ __html: msg.data.furigana_html }} />
                                                ) : (
                                                    <span>{msg.data?.ai_response_ja}</span>
                                                )}
                                            </div>
                                            <p className="text-xs text-slate-500 border-t pt-1 italic">🇮🇩 {msg.data?.indonesian_translation}</p>
                                            
                                            {msg.data?.user_correction?.has_error && (
                                                <div className="p-2.5 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 font-sans mt-2">
                                                    <div className="font-bold flex items-center gap-1 text-amber-800">
                                                        <i className="fa-solid fa-triangle-exclamation"></i> Koreksi
                                                    </div>
                                                    <div className="line-through text-slate-400">{msg.data.user_correction.user_original}</div>
                                                    <div className="text-emerald-600 font-bold">{msg.data.user_correction.corrected}</div>
                                                    <p className="text-[10px] text-slate-600 mt-0.5">{msg.data.user_correction.explanation}</p>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        <div ref={chatEndRef} />
                    </div>

                    {hints.length > 0 && (
                        <div className="bg-slate-100 border-t border-slate-200 p-3 space-y-2 font-sans">
                            <div className="flex items-center justify-between text-xs text-amber-700 font-bold">
                                <span><i className="fa-solid fa-lightbulb mr-1"></i> Rekomendasi Balasan:</span>
                                <button onClick={() => setHints([])} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                {hints.map((h, hIdx) => (
                                    <button
                                        key={hIdx}
                                        onClick={() => {
                                            setInputMessage(h.japanese);
                                            setHints([]);
                                        }}
                                        className="p-2 rounded-xl bg-white border border-slate-200 hover:border-amber-400 text-left transition-all text-xs space-y-0.5"
                                    >
                                        <div className="font-bold text-slate-800 japanese-text line-clamp-1">{h.japanese}</div>
                                        <div className="text-[10px] text-slate-500 line-clamp-1">{h.indonesian}</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="p-3 bg-white border-t border-slate-200 space-y-2 font-sans">
                        <div className="flex items-center justify-between px-1 text-[11px]">
                            <button
                                onClick={onGetHints}
                                disabled={isLoadingHints || chatMessages.length === 0}
                                className="text-amber-600 hover:text-amber-700 font-bold flex items-center gap-1 disabled:opacity-40"
                            >
                                <i className="fa-solid fa-lightbulb"></i>
                                {isLoadingHints ? 'Mencari ide...' : 'Get Hint (Rekomendasi Balasan)'}
                            </button>
                        </div>

                        <div className="flex items-center gap-2">
                            {speechSupported && (
                                <button
                                    onClick={() => toggleListening('ja-JP')}
                                    className={`p-3 rounded-2xl border transition-all ${
                                        isListening ? 'bg-rose-600 text-white border-rose-500 animate-pulse' : 'bg-slate-100 text-slate-700 border-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-microphone"></i>
                                </button>
                            )}
                            <input
                                type="text"
                                value={inputMessage}
                                onChange={(e) => setInputMessage(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && onSendMessage()}
                                placeholder="Ketik balasan..."
                                className="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs md:text-sm text-slate-800 focus:outline-none japanese-text"
                            />
                            <button
                                onClick={() => onSendMessage()}
                                disabled={!inputMessage.trim() || isLoading}
                                className="px-5 py-3 bg-rose-600 text-white font-bold rounded-2xl shadow-sm"
                            >
                                <i className="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function EvaluationScreen({ evaluation, sessionConfig, targetBunpouList, onRestart }) {
            const scores = evaluation.scores || {};

            return (
                <div className="space-y-6 animate-fade-in font-sans max-w-4xl mx-auto">
                    <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm flex flex-col md:flex-row items-center justify-between gap-6">
                        <div className="space-y-1 text-center md:text-left">
                            <span className="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-full text-xs font-bold">
                                Sesi Selesai & Tersimpan
                            </span>
                            <h2 className="text-2xl font-black text-slate-800">Hasil Evaluasi Percakapan</h2>
                            <p className="text-xs text-slate-500">
                                Peran: <span className="text-slate-800 font-bold">{sessionConfig.role}</span> • Level: <span className="text-slate-800 font-bold">{sessionConfig.level}</span>
                            </p>
                        </div>

                        <div className="w-24 h-24 rounded-full bg-rose-50 border-4 border-rose-500 flex flex-col items-center justify-center shadow-sm">
                            <span className="text-2xl font-black text-rose-600">{scores.overall || 88}</span>
                            <span className="text-[9px] text-slate-400 uppercase tracking-widest">Overall</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                        {[
                            { label: 'Grammar', value: scores.grammar },
                            { label: 'Vocabulary', value: scores.vocabulary },
                            { label: 'Naturalness', value: scores.naturalness },
                            { label: 'Fluency', value: scores.fluency },
                            { label: 'Pronunciation', value: scores.pronunciation },
                            { label: 'Bunpou Target', value: scores.bunpou_mastery }
                        ].map((s, idx) => (
                            <div key={idx} className="bg-white p-4 rounded-2xl border border-slate-200 text-center space-y-1 shadow-sm">
                                <span className="text-xs text-slate-400 font-medium">{s.label}</span>
                                <div className="text-2xl font-black text-slate-800">{s.value || 0}<span className="text-xs text-slate-400">/100</span></div>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                        <h3 className="font-bold text-slate-800 text-base flex items-center gap-2">
                            <i className="fa-solid fa-triangle-exclamation text-amber-500"></i> Catatan Evaluasi Kesalahan
                        </h3>

                        {evaluation.mistakes_breakdown && evaluation.mistakes_breakdown.length > 0 ? (
                            <div className="space-y-3">
                                {evaluation.mistakes_breakdown.map((m, idx) => (
                                    <div key={idx} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2 text-xs">
                                        <span className="px-2 py-0.5 rounded bg-rose-100 text-rose-700 text-[10px] font-bold">
                                            {m.category}
                                        </span>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            <div className="p-2.5 rounded-xl bg-white border border-slate-200">
                                                <span className="text-[10px] text-slate-400 block">Dikatakan:</span>
                                                <span className="text-slate-800 line-through japanese-text">{m.user_said}</span>
                                            </div>
                                            <div className="p-2.5 rounded-xl bg-white border border-emerald-200">
                                                <span className="text-[10px] text-emerald-600 block">Lebih Alami:</span>
                                                <span className="text-emerald-700 font-bold japanese-text">{m.better_way}</span>
                                            </div>
                                        </div>
                                        <p className="text-slate-600 text-[11px] pt-1 leading-relaxed">
                                            💡 {m.explanation}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <p className="text-xs text-slate-500 italic">Luar biasa! Tidak ada kesalahan fatal ditemukan.</p>
                        )}
                    </div>

                    <div className="flex justify-center pt-2">
                        <button
                            onClick={onRestart}
                            className="px-8 py-3.5 bg-rose-600 hover:bg-rose-500 text-white font-extrabold text-sm rounded-2xl shadow-md transition-all flex items-center gap-2"
                        >
                            <i className="fa-solid fa-rotate-right"></i> Mulai Sesi Baru Lainnya
                        </button>
                    </div>
                </div>
            );
        }

        function HistoryScreen({ history, onSelectSession, onClearHistory }) {
            return (
                <div className="space-y-6 animate-fade-in font-sans max-w-4xl mx-auto">
                    <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800">Riwayat Latihan</h2>
                            <p className="text-xs text-slate-500">Sesi percakapan dan penerjemahan tersimpan otomatis</p>
                        </div>
                        {history.length > 0 && (
                            <button onClick={onClearHistory} className="px-3 py-1.5 text-xs text-rose-600 border border-rose-200 rounded-xl font-bold">
                                Hapus Riwayat
                            </button>
                        )}
                    </div>

                    {history.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 text-slate-400">
                            <p className="text-xs font-bold">Belum Ada Sesi Tersimpan</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {history.map((sess) => (
                                <div
                                    key={sess.id}
                                    onClick={() => onSelectSession(sess)}
                                    className="p-4 bg-white hover:bg-slate-50 rounded-2xl border border-slate-200 transition-all cursor-pointer flex items-center justify-between shadow-sm"
                                >
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <span className="font-bold text-slate-800 text-sm">{sess.role}</span>
                                            <span className="text-[10px] bg-rose-50 text-rose-700 px-2 py-0.5 rounded-full font-mono font-bold">
                                                {sess.level}
                                            </span>
                                        </div>
                                        <p className="text-xs text-slate-400 mt-0.5">📅 {sess.date} • {sess.location}</p>
                                    </div>
                                    <span className="text-xl font-black text-indigo-600">{sess.scores?.overall || 85}%</span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
