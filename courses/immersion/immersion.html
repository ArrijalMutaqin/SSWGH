  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef } = React;

    // Helper: Cek apakah kata memiliki Kanji
    const hasKanji = (str) => /[\u4e00-\u9faf\u3400-\u4dbf]/.test(str || '');

    function CSSLogo() {
      return e('a', { href: '/', className: 'flex items-center gap-2 group transition-transform hover:scale-105 font-sans shrink-0', title: 'Kembali ke Dashboard Utama' },
        e('div', { className: 'w-8 h-8 sm:w-10 sm:h-10 rounded-2xl bg-amber-100 border border-amber-300 flex items-center justify-center text-amber-800 shadow-sm shrink-0' },
          e('svg', { className: 'w-4 h-4 sm:w-6 sm:h-6 fill-current', viewBox: '0 0 24 24' },
            e('path', { d: 'M12 2L2 7h3v13h2V12h10v8h2V7h3L12 2zm-1 8H8V7h3v3zm5 0h-3V7h3v3z' }),
            e('path', { d: 'M2.5 19h19v2h-19z', className: 'opacity-50' })
          )
        ),
        e('div', { className: 'flex flex-col text-left' },
          e('div', { className: 'flex items-center gap-1' },
            e('span', { className: 'text-sm sm:text-lg font-bold tracking-tight text-stone-900 font-serif' }, '日本語の旅'),
            e('span', { className: 'text-[8px] sm:text-[9px] font-bold px-1 py-0.2 rounded bg-amber-100 text-amber-800 border border-amber-300 uppercase tracking-widest font-sans' }, 'READER')
          ),
          e('span', { className: 'text-[8px] sm:text-[9px] font-semibold text-stone-500 tracking-wider uppercase font-sans' }, 'Novel Dokkai')
        )
      );
    }

    function CustomPageDropdown({ pages, selectedIdx, onSelect }) {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);
      const currentPage = pages[selectedIdx];

      useEffect(() => {
        function handleClickOutside(event) {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false);
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return e('div', { className: 'relative w-32 xs:w-40 sm:w-60 z-[30] font-sans shrink-0', ref: dropdownRef },
        e('button', {
          type: 'button',
          onClick: () => setIsOpen(!isOpen),
          className: 'w-full bg-white hover:bg-stone-50 text-stone-800 text-xs font-semibold px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl border border-stone-300 transition-all flex items-center justify-between shadow-sm'
        },
          e('div', { className: 'flex items-center space-x-1 min-w-0 pr-1' },
            e('i', { className: 'fa-solid fa-book-open text-amber-700 text-[10px] shrink-0' }),
            e('span', { className: 'truncate text-[10px] sm:text-xs' }, currentPage ? 'Hal ' + currentPage.pageNumber : 'Halaman...')
          ),
          e('i', { className: 'fa-solid fa-chevron-down text-stone-400 text-[8px] shrink-0 ml-1' })
        ),
        isOpen ? e('div', { className: 'absolute right-0 w-48 sm:w-full mt-2 z-[40] bg-white border border-stone-200 rounded-2xl shadow-xl overflow-hidden max-h-60 overflow-y-auto p-1 space-y-1' },
          pages.map((p, idx) => {
            const isSelected = selectedIdx === idx;
            return e('button', {
              key: idx,
              onClick: () => { onSelect(idx); setIsOpen(false); },
              className: 'w-full px-2.5 py-2 text-left text-xs transition-all rounded-xl flex items-center justify-between ' + (isSelected ? 'bg-amber-600 text-white font-bold' : 'text-stone-700 hover:bg-stone-100')
            },
              e('div', { className: 'flex items-center space-x-2 min-w-0 pr-1' },
                e('span', { className: 'w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-bold shrink-0 ' + (isSelected ? 'bg-white/20 text-white' : 'bg-stone-100 text-stone-600') }, p.pageNumber),
                e('span', { className: 'truncate text-[10px] sm:text-xs' }, p.title)
              ),
              isSelected ? e('i', { className: 'fa-solid fa-check text-white text-[9px] shrink-0' }) : null
            );
          })
        ) : null
      );
    }

    function parseFirestoreRestFields(fields) {
      if (!fields) return {};
      const result = {};
      for (const key in fields) {
        const val = fields[key];
        if (val.stringValue !== undefined) result[key] = val.stringValue;
        else if (val.integerValue !== undefined) result[key] = Number(val.integerValue);
        else if (val.doubleValue !== undefined) result[key] = Number(val.doubleValue);
        else if (val.booleanValue !== undefined) result[key] = val.booleanValue;
        else if (val.mapValue !== undefined) result[key] = parseFirestoreRestFields(val.mapValue.fields);
        else if (val.arrayValue !== undefined) {
          result[key] = (val.arrayValue.values || []).map(v => {
            if (v.mapValue) return parseFirestoreRestFields(v.mapValue.fields);
            if (v.stringValue) return v.stringValue;
            return v;
          });
        }
      }
      return result;
    }

    function App() {
      const [user, setUser] = useState(null);
      const [isAuthenticating, setIsAuthenticating] = useState(false);
      
      const [novelCatalog, setNovelCatalog] = useState([]);
      const [isCatalogLoading, setIsCatalogLoading] = useState(true);

      const [selectedNovel, setSelectedNovel] = useState(null);
      const [currentPageIdx, setCurrentPageIdx] = useState(0);
      const [userProgress, setUserProgress] = useState({});
      const [saveToast, setSaveToast] = useState(false);

      const pages = selectedNovel ? (selectedNovel.pages || []).sort((a,b) => Number(a.pageNumber) - Number(b.pageNumber)) : [];
      const activePage = pages[currentPageIdx] || null;
      
      const [fontSize, setFontSize] = useState('medium');
      const [activeWordKey, setActiveWordKey] = useState(null);
      const [tooltipAlign, setTooltipAlign] = useState('center');
      const [openedTranslations, setOpenedTranslations] = useState({});

      /* STATE TERKAIT AUDIO TTS & HIGHLIGHT */
      const [isAudioModalOpen, setIsAudioModalOpen] = useState(false);
      const [activeParaIdx, setActiveParaIdx] = useState(0);
      const [activeTokenIdx, setActiveTokenIdx] = useState(-1);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [isReadingHeader, setIsReadingHeader] = useState(false);
      
      const highlightedElRef = useRef(null);
      const lastTokenIdxRef = useRef(-1);

      useEffect(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
          };
        }
      }, []);

      useEffect(() => {
        if (highlightedElRef.current) {
          highlightedElRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, [activeTokenIdx]);

      const fetchNovelCatalog = async () => {
        setIsCatalogLoading(true);
        let catalog = [];

        const fetchFromSDK = new Promise(async (resolve, reject) => {
          try {
            if (!window.firestoreUtils || !window.db) return reject("SDK_NOT_READY");
            const utils = window.firestoreUtils;
            
            // 1. Ambil dokumen utama novel
            const colRef = utils.collection(window.db, 'immersion_novels');
            const snapshot = await utils.getDocs(colRef);
            const sdkCatalog = [];

            for (const docSnap of snapshot.docs) {
              const novelData = { id: docSnap.id, ...docSnap.data() };

              // 2. Fetch Sub-collection 'pages' untuk tiap novel
              const pagesColRef = utils.collection(window.db, 'immersion_novels', docSnap.id, 'pages');
              const pagesSnapshot = await utils.getDocs(pagesColRef);

              const pages = [];
              pagesSnapshot.forEach(pageDoc => {
                pages.push(pageDoc.data());
              });

              // Urutkan halaman ascending
              pages.sort((a, b) => Number(a.pageNumber) - Number(b.pageNumber));

              novelData.pages = pages;
              sdkCatalog.push(novelData);
            }

            if (sdkCatalog.length > 0) resolve(sdkCatalog);
            else reject("EMPTY_SDK");
          } catch (err) { reject(err); }
        });

        const fetchFromRestAPI = async () => {
          const projectId = window.firebaseProjectId || "sswghtabi";
          
          const res = await fetch(`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/immersion_novels`);
          if (!res.ok) throw new Error("REST API Error");
          const data = await res.json();
          if (!data.documents) return [];

          const restCatalog = [];

          for (const doc of data.documents) {
            const novelData = parseFirestoreRestFields(doc.fields);
            const docId = doc.name.split('/').pop();
            novelData.id = docId;

            // Fetch Sub-collection 'pages' via REST API
            const pagesRes = await fetch(`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/immersion_novels/${docId}/pages`);
            if (pagesRes.ok) {
              const pagesData = await pagesRes.json();
              if (pagesData.documents) {
                const pages = pagesData.documents.map(p => parseFirestoreRestFields(p.fields));
                pages.sort((a, b) => Number(a.pageNumber) - Number(b.pageNumber));
                novelData.pages = pages;
              } else {
                novelData.pages = [];
              }
            } else {
              novelData.pages = [];
            }

            restCatalog.push(novelData);
          }

          return restCatalog;
        };

        try {
          const timeout = new Promise((_, reject) => setTimeout(() => reject("TIMEOUT"), 3000));
          catalog = await Promise.race([fetchFromSDK, timeout]);
        } catch (e) {
          try { catalog = await fetchFromRestAPI(); } catch (restErr) { console.error(restErr); }
        }

        if (catalog && catalog.length > 0) setNovelCatalog(catalog);
        setIsCatalogLoading(false);
      };

      const fetchUserProgress = async (userId) => {
        if (!window.firestoreUtils || !window.db || !userId) return;
        try {
          const utils = window.firestoreUtils;
          const colRef = utils.collection(window.db, 'users', userId, 'progress');
          const snapshot = await utils.getDocs(colRef);
          
          const progressData = {};
          snapshot.forEach(doc => {
            const data = doc.data();
            progressData[doc.id] = {
              pageIdx: data.lastReadPageIndex || 0,
              completed: !!data.isCompleted
            };
          });
          setUserProgress(progressData);
        } catch (err) {
          console.error("Gagal memuat progress user:", err);
        }
      };

      const saveUserProgress = async (novelId, pageIdx, isCompleted = false) => {
        if (!user || !window.firestoreUtils || !window.db || !novelId) return;
        try {
          const utils = window.firestoreUtils;
          const docRef = utils.doc(window.db, 'users', user.uid, 'progress', novelId);
          await utils.setDoc(docRef, {
            lastReadPageIndex: pageIdx,
            isCompleted: isCompleted,
            updatedAt: new Date()
          }, { merge: true });

          setUserProgress(prev => ({
            ...prev,
            [novelId]: { pageIdx: pageIdx, completed: isCompleted }
          }));
        } catch (error) {
          console.error("Gagal menyimpan progress:", error);
        }
      };

      useEffect(() => {
        const init = () => {
          if (window.authUtils && window.auth) {
            window.authUtils.onAuthStateChanged(window.auth, currentUser => {
              setUser(currentUser);
              if (currentUser) fetchUserProgress(currentUser.uid);
              else setUserProgress({});
            });
          }
          fetchNovelCatalog();
        };

        if (window.db) init();
        else window.addEventListener('firebase-ready', init, { once: true });
      }, []);

      const changePageIdx = (newIdx) => {
        stopAudioTTS();
        setCurrentPageIdx(newIdx);
        setActiveWordKey(null);
        setOpenedTranslations({});

        if (selectedNovel && user) {
          const currentProgress = userProgress[selectedNovel.id] || {};
          saveUserProgress(selectedNovel.id, newIdx, currentProgress.completed || false);
        }
      };

      const openNovelFromBookmark = (novel) => {
        setSelectedNovel(novel);
        const prog = userProgress[novel.id];
        const savedIdx = prog ? prog.pageIdx : 0;
        setCurrentPageIdx(savedIdx);
      };

      const openNovelFromBeginning = (novel) => {
        setSelectedNovel(novel);
        setCurrentPageIdx(0);
        if (user) {
          const currentProgress = userProgress[novel.id] || {};
          saveUserProgress(novel.id, 0, currentProgress.completed || false);
        }
      };

      const handleManualBookmark = () => {
        if (!selectedNovel || !user) return;
        const currentProgress = userProgress[selectedNovel.id] || {};
        saveUserProgress(selectedNovel.id, currentPageIdx, currentProgress.completed || false);
        triggerToast();
      };

      const handleMarkCompleted = () => {
        if (!selectedNovel || !user) return;
        saveUserProgress(selectedNovel.id, currentPageIdx, true);
        triggerToast();
      };

      const triggerToast = () => {
        setSaveToast(true);
        setTimeout(() => setSaveToast(false), 2000);
      };

      /* FUNGSI SPEECH SYNTHESIS (TTS) */
      const stopAudioTTS = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        setIsPlayingAudio(false);
        setIsReadingHeader(false);
        setActiveTokenIdx(-1);
        lastTokenIdxRef.current = -1;
      };

      const getNativeJaVoice = () => {
        if (!('speechSynthesis' in window)) return null;
        try {
          const voices = window.speechSynthesis.getVoices() || [];
          return voices.find(v => v.lang && (v.lang.toLowerCase().includes('ja') || v.lang.toLowerCase().includes('jp'))) || null;
        } catch (e) { return null; }
      };

      const openAudioScreen = () => {
        setIsAudioModalOpen(true);
        setActiveParaIdx(0);
        setActiveTokenIdx(-1);
        lastTokenIdxRef.current = -1;
        playParagraphTTS(currentPageIdx, 0, true);
      };

      const closeAudioScreen = () => {
        stopAudioTTS();
        setIsAudioModalOpen(false);
      };

      const playParagraphTTS = (pageIdxToPlay, pIdx, shouldReadHeader = false) => {
        stopAudioTTS();

        const targetPage = pages[pageIdxToPlay];
        if (!targetPage || !targetPage.content) return;

        let isNewChapter = false;
        if (pageIdxToPlay === 0) {
          isNewChapter = true;
        } else if (pageIdxToPlay > 0 && pages[pageIdxToPlay - 1]) {
          const prevChap = (pages[pageIdxToPlay - 1].chapter || '').trim().toLowerCase();
          const currChap = (targetPage.chapter || '').trim().toLowerCase();
          
          if (currChap !== '' && currChap !== prevChap) {
            isNewChapter = true;
          }
        }

        if (pIdx === 0 && shouldReadHeader && isNewChapter && (targetPage.chapter || targetPage.title)) {
          setIsReadingHeader(true);
          setIsPlayingAudio(true);
          
          const headerText = (targetPage.chapter ? targetPage.chapter + '。' : '') + (targetPage.title || '');
          const headerUtterance = new SpeechSynthesisUtterance(headerText);
          headerUtterance.lang = "ja-JP";
          headerUtterance.rate = 0.85;

          const jaVoice = getNativeJaVoice();
          if (jaVoice) headerUtterance.voice = jaVoice;

          headerUtterance.onend = () => {
            setIsReadingHeader(false);
            setTimeout(() => playParagraphTTS(pageIdxToPlay, 0, false), 400);
          };

          headerUtterance.onerror = () => {
            setIsReadingHeader(false);
            playParagraphTTS(pageIdxToPlay, 0, false);
          };

          window.speechSynthesis.speak(headerUtterance);
          return;
        }

        if (!targetPage.content[pIdx]) return;

        const paragraphObj = targetPage.content[pIdx];
        const tokens = paragraphObj.tokens || [];
        
        const fullText = tokens.map(t => t.jp).join('');
        if (!fullText) return;

        setActiveParaIdx(pIdx);
        setIsPlayingAudio(true);

        const utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = "ja-JP";
        utterance.rate = 0.85;
        
        const jaVoice = getNativeJaVoice();
        if (jaVoice) utterance.voice = jaVoice;

        const tokenRanges = [];
        let charCursor = 0;
        tokens.forEach(tok => {
          const len = tok.jp.length;
          tokenRanges.push({ start: charCursor, end: charCursor + len });
          charCursor += len;
        });

        lastTokenIdxRef.current = -1;

        utterance.onboundary = (event) => {
          if (event.charIndex !== undefined) {
            const charIdx = event.charIndex;
            for (let i = Math.max(0, lastTokenIdxRef.current); i < tokenRanges.length; i++) {
              if (charIdx >= tokenRanges[i].start && charIdx < tokenRanges[i].end) {
                if (i !== lastTokenIdxRef.current) {
                  lastTokenIdxRef.current = i;
                  setActiveTokenIdx(i);
                }
                break;
              }
            }
          }
        };

        utterance.onend = () => {
          setActiveTokenIdx(-1);
          lastTokenIdxRef.current = -1;

          if (pIdx + 1 < targetPage.content.length) {
            setTimeout(() => playParagraphTTS(pageIdxToPlay, pIdx + 1, false), 400);
          } 
          else if (pageIdxToPlay + 1 < pages.length) {
            const nextIdx = pageIdxToPlay + 1;
            setCurrentPageIdx(nextIdx);
            if (user && selectedNovel) {
              const currentProgress = userProgress[selectedNovel.id] || {};
              saveUserProgress(selectedNovel.id, nextIdx, currentProgress.completed || false);
            }
            setTimeout(() => {
              playParagraphTTS(nextIdx, 0, true);
            }, 600);
          } else {
            setIsPlayingAudio(false);
          }
        };

        utterance.onerror = () => {
          stopAudioTTS();
        };

        window.speechSynthesis.speak(utterance);
